<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Modern White App Icon Tile Gradient -->
    <linearGradient id="tileBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>

    <!-- Subtle Inner Grid / Technical Aura -->
    <radialGradient id="centerGlow" cx="256" cy="240" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- ODU-300 Outdoor Casing Gradient (Pure White Matte) -->
    <linearGradient id="oduBody" x1="140" y1="96" x2="310" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- IDU-300 Indoor Router Body Gradient -->
    <linearGradient id="iduBody" x1="176" y1="320" x2="388" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Plus / LTE Signal Accent Gradient -->
    <linearGradient id="signalGrad" x1="280" y1="88" x2="412" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Coax Cable Metallic Gradient -->
    <linearGradient id="coaxLine" x1="216" y1="316" x2="290" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Soft Drop Shadow for Hardware Units -->
    <filter id="hwShadow" x="80" y="64" width="360" height="390" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- 1. App Icon Squircle Tile (White Modern) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tileBg)" stroke="#E2E8F0" stroke-width="4" />
  <rect x="20" y="20" width="472" height="472" rx="108" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="256" cy="248" r="200" fill="url(#centerGlow)" />

  <!-- 2. LTE-A 2CA Radio Waves (Top Right) -->
  <g stroke="url(#signalGrad)" stroke-linecap="round">
    <path d="M 326 164 A 42 42 0 0 1 368 206" stroke-width="10" opacity="0.95" />
    <path d="M 326 132 A 74 74 0 0 1 400 206" stroke-width="10" opacity="0.65" />
    <path d="M 326 100 A 106 106 0 0 1 432 206" stroke-width="10" opacity="0.35" />
  </g>

  <!-- 3. Hardware Group (ODU Outdoor Modem + Coax + IDU Indoor Router) -->
  <g filter="url(#hwShadow)">

    <!-- Mast Pole & Clamp behind ODU -->
    <rect x="128" y="88" width="18" height="260" rx="9" fill="#CBD5E1" />
    <rect x="132" y="88" width="5" height="260" rx="2.5" fill="#E2E8F0" />
    <!-- Mounting Brackets -->
    <rect x="122" y="138" width="40" height="14" rx="4" fill="#94A3B8" />
    <rect x="122" y="256" width="40" height="14" rx="4" fill="#94A3B8" />

    <!-- Coax TV-SAT Cable connecting ODU F-Port to IDU -->
    <path d="M 224 316 L 224 348 C 224 374, 244 384, 276 384 L 304 384" stroke="url(#coaxLine)" stroke-width="9" stroke-linecap="round" fill="none" />

    <!-- ODU-300 Outdoor Modem Unit (White Weatherproof Housing) -->
    <!-- Bottom Brass SMA & F-Type Connectors -->
    <rect x="184" y="302" width="14" height="18" rx="3" fill="#D97706" />
    <rect x="216" y="302" width="16" height="22" rx="3" fill="#64748B" />
    <rect x="250" y="302" width="14" height="18" rx="3" fill="#D97706" />

    <!-- ODU Main Enclosure -->
    <rect x="152" y="102" width="144" height="206" rx="30" fill="url(#oduBody)" stroke="#CBD5E1" stroke-width="3.5" />
    <!-- ODU Recessed Front Bezel -->
    <rect x="168" y="118" width="112" height="174" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

    <!-- ODU Internal MIMO Patch Antenna Motif (Subtle Technical Graphic) -->
    <g stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round">
      <line x1="196" y1="150" x2="252" y2="150" />
      <line x1="204" y1="166" x2="244" y2="166" />
      <line x1="196" y1="182" x2="252" y2="182" />
    </g>

    <!-- ODU Badge & Status LED Pill -->
    <rect x="196" y="218" width="56" height="22" rx="11" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Active LTE Cat.6 Status LED (Emerald Green) -->
    <circle cx="210" cy="229" r="5" fill="#10B981" />
    <!-- Signal Bars on ODU -->
    <rect x="223" y="230" width="3.5" height="5" rx="1" fill="#0F172A" />
    <rect x="229" y="227" width="3.5" height="8" rx="1" fill="#0F172A" />
    <rect x="235" y="223" width="3.5" height="12" rx="1" fill="#10B981" />

    <!-- ODU Label -->
    <text x="224" y="268" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" letter-spacing="1.5" fill="#334155">ODU</text>

    <!-- IDU-300 Indoor Router Unit (Foreground Bottom-Right) -->
    <!-- Router Base Stand -->
    <rect x="218" y="410" width="140" height="8" rx="4" fill="#334155" />
    <!-- IDU Main Chassis (White/Slate Two-Tone Modern Housing) -->
    <rect x="192" y="336" width="192" height="76" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3.5" />
    <!-- IDU Dark Front Display Panel -->
    <rect x="204" y="348" width="168" height="52" rx="13" fill="url(#iduBody)" />

    <!-- IDU Label -->
    <text x="242" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="1.2" fill="#F8FAFC">IDU</text>

    <!-- IDU Front Status LEDs (Power, WiFi, LAN, ODU Power, LTE CA) -->
    <circle cx="288" cy="374" r="4.5" fill="#10B981" />
    <circle cx="306" cy="374" r="4.5" fill="#10B981" />
    <circle cx="324" cy="374" r="4.5" fill="#38BDF8" />
    <circle cx="342" cy="374" r="4.5" fill="#10B981" />
    <!-- Coax Power Active Ring -->
    <circle cx="342" cy="374" r="8" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.45" />
  </g>
</svg>
