<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- 1. App Icon Squircle Background (Studio Pearl White) -->
    <linearGradient id="appBg" x1="64" y1="16" x2="448" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Subtle Ambient Studio Backlight -->
    <radialGradient id="ambientGlow" cx="256" cy="230" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- ODU LED Signal Underglow (Violet/Blue = Bardzo dobra / dobra moc sygnału) -->
    <radialGradient id="ledUnderglow" cx="222" cy="384" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <!-- 2. ODU-200 3D Molded Body Gradients -->
    <!-- Main Hood Center Face -->
    <linearGradient id="hoodCenter" x1="256" y1="68" x2="256" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>

    <!-- Left Wing 3D Curvature Shading -->
    <linearGradient id="hoodLeftWing" x1="120" y1="190" x2="188" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Right Wing 3D Curvature Shading -->
    <linearGradient id="hoodRightWing" x1="324" y1="190" x2="392" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Top Chamfered Roof Highlight -->
    <linearGradient id="hoodRoof" x1="140" y1="68" x2="372" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Base Flange Horizontal 3D Cylinder Shading -->
    <linearGradient id="flangeGrad" x1="100" y1="340" x2="412" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="12%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="88%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Lower Base Skirt Shading -->
    <linearGradient id="flangeLower" x1="100" y1="362" x2="412" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="15%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- SIM Cap 3D Cylindrical Shading -->
    <linearGradient id="simCapGrad" x1="132" y1="386" x2="206" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="25%" stop-color="#F1F5F9" />
      <stop offset="55%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Metallic F-Connector Thread Gradient -->
    <linearGradient id="fPortThreads" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="30%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Nickel/Chrome Bolt & Hardware Gradient -->
    <linearGradient id="metalNut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Cyfrowy Polsat Badge Gradient -->
    <linearGradient id="cpBadge" x1="186" y1="168" x2="326" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Multi-Layer Studio Drop Shadow for ODU-200 -->
    <filter id="oduShadow" x="50" y="40" width="412" height="456" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <!-- Clip Path for ODU-200 Main Hood -->
    <clipPath id="hoodClip">
      <path d="M 148 76 Q 256 60 364 76 L 376 98 L 388 308 Q 389 329 406 334 L 106 334 Q 123 329 124 308 L 136 98 Z" />
    </clipPath>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. MODERN WHITE SQUIRCLE ICON TILE                           -->
  <!-- ============================================================ -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#appBg)" stroke="#CBD5E1" stroke-width="3" />
  <rect x="19" y="19" width="474" height="474" rx="109" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="256" cy="236" r="210" fill="url(#ambientGlow)" />

  <!-- Subtle RF Telemetry Rings in Background behind ODU-200 -->
  <g stroke="#0EA5E9" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 6">
    <circle cx="256" cy="210" r="165" />
    <circle cx="256" cy="210" r="198" />
  </g>

  <!-- ============================================================ -->
  <!-- 2. AUTHENTIC ODU-200 MODEM (3D STUDIO VECTOR)                -->
  <!-- ============================================================ -->
  <g filter="url(#oduShadow)">

    <!-- ── A. UNDER-CHASSIS HARDWARE (F-PORTS, SIM CAP, CHAIN) ── -->

    <!-- IDU F-Type Coax Port (x=282) -->
    <g>
      <!-- Mounting Boss -->
      <rect x="266" y="370" width="32" height="8" rx="1.5" fill="url(#metalNut)" stroke="#475569" stroke-width="1" />
      <!-- Hex Nut -->
      <rect x="271" y="377" width="22" height="6" rx="1" fill="url(#metalNut)" stroke="#334155" stroke-width="1" />
      <!-- Threaded Coax Barrel -->
      <rect x="273" y="383" width="18" height="24" rx="1" fill="url(#fPortThreads)" stroke="#1E293B" stroke-width="1" />
      <!-- Fine Thread Ridges -->
      <g stroke="#94A3B8" stroke-width="1" opacity="0.65">
        <line x1="274" y1="387" x2="290" y2="387" />
        <line x1="274" y1="390" x2="290" y2="390" />
        <line x1="274" y1="393" x2="290" y2="393" />
        <line x1="274" y1="396" x2="290" y2="396" />
        <line x1="274" y1="399" x2="290" y2="399" />
        <line x1="274" y1="402" x2="290" y2="402" />
        <line x1="274" y1="405" x2="290" y2="405" />
      </g>
    </g>

    <!-- LNB F-Type Coax Port (x=358) -->
    <g>
      <!-- Mounting Boss -->
      <rect x="342" y="370" width="32" height="8" rx="1.5" fill="url(#metalNut)" stroke="#475569" stroke-width="1" />
      <!-- Hex Nut -->
      <rect x="347" y="377" width="22" height="6" rx="1" fill="url(#metalNut)" stroke="#334155" stroke-width="1" />
      <!-- Threaded Coax Barrel -->
      <rect x="349" y="383" width="18" height="24" rx="1" fill="url(#fPortThreads)" stroke="#1E293B" stroke-width="1" />
      <!-- Fine Thread Ridges -->
      <g stroke="#94A3B8" stroke-width="1" opacity="0.65">
        <line x1="350" y1="387" x2="366" y2="387" />
        <line x1="350" y1="390" x2="366" y2="390" />
        <line x1="350" y1="393" x2="366" y2="393" />
        <line x1="350" y1="396" x2="366" y2="396" />
        <line x1="350" y1="399" x2="366" y2="399" />
        <line x1="350" y1="402" x2="366" y2="402" />
        <line x1="350" y1="405" x2="366" y2="405" />
      </g>
    </g>

    <!-- SIM Card Hermetic Cap (Left Side, x=132..206) -->
    <g>
      <!-- Top Collar under flange -->
      <rect x="136" y="370" width="66" height="7" fill="#CBD5E1" stroke="#64748B" stroke-width="1.2" />
      <!-- Main Ribbed Cap Body -->
      <path d="M 132 377 L 206 377 L 204 401 Q 204 404 198 404 L 140 404 Q 134 404 134 401 Z" fill="url(#simCapGrad)" stroke="#64748B" stroke-width="1.5" />
      <!-- Grip Ribs on SIM Cap -->
      <line x1="146" y1="377" x2="146" y2="403" stroke="#94A3B8" stroke-width="1.5" />
      <line x1="169" y1="377" x2="169" y2="403" stroke="#94A3B8" stroke-width="1.5" />
      <line x1="192" y1="377" x2="192" y2="403" stroke="#94A3B8" stroke-width="1.5" />
      <!-- Lower Boss of SIM Cap -->
      <rect x="155" y="404" width="28" height="10" rx="1.5" fill="url(#simCapGrad)" stroke="#64748B" stroke-width="1.4" />
      <!-- Center Screw Post & Swivel Ring -->
      <rect x="163" y="414" width="12" height="5" fill="url(#metalNut)" stroke="#475569" stroke-width="1.2" />
      <rect x="156" y="419" width="26" height="3.5" rx="1.5" fill="url(#metalNut)" stroke="#334155" stroke-width="1.2" />
      <path d="M 164 422.5 A 5 4 0 0 0 174 422.5" fill="#94A3B8" stroke="#334155" stroke-width="1.2" />
    </g>

    <!-- Anchor Screw for Chain on Chassis Underside (x=222) -->
    <g>
      <circle cx="222" cy="382" r="24" fill="url(#ledUnderglow)" />
      <rect x="208" y="374" width="28" height="9" rx="1.5" fill="url(#flangeLower)" stroke="#64748B" stroke-width="1.3" />
      <rect x="214" y="383" width="16" height="4" rx="1" fill="url(#metalNut)" stroke="#475569" stroke-width="1.2" />
      <!-- Active Status LED Dot (Fioletowa/Niebieska = Bardzo dobra moc sygnału) -->
      <circle cx="242" cy="379" r="3.5" fill="#6366F1" stroke="#E0E7FF" stroke-width="1" />
    </g>

    <!-- Iconic Hanging Metal Retention Chain (U-Loop from x=176,y=421 down to y=474 and up to x=214,y=385) -->
    <g>
      <!-- Outer Dark Steel Chain Path -->
      <path d="M 176 421 C 185 422, 184 474, 196 474 C 209 474, 211 430, 206 404 C 203 390, 207 385, 215 385"
            stroke="#334155" stroke-width="5.5" stroke-linecap="round" fill="none" />
      <!-- Inner Metallic Link Highlights -->
      <path d="M 176 421 C 185 422, 184 474, 196 474 C 209 474, 211 430, 206 404 C 203 390, 207 385, 215 385"
            stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" fill="none" />
    </g>

    <!-- ── B. STEPPED LOWER FLANGE & FEET (y=334..386) ── -->
    <!-- Lower Stepped Flange Cutout Chassis -->
    <path d="M 105 352 L 407 352 L 406 385 L 382 385 L 380 371 L 328 371 L 326 385 L 298 385 L 296 371 L 246 371 L 244 385 L 208 385 L 206 371 L 132 371 L 130 385 L 106 385 Z"
          fill="url(#flangeLower)" stroke="#64748B" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Upper Main Flange Rim (y=334..353) -->
    <rect x="103" y="334" width="306" height="19" rx="3.5" fill="url(#flangeGrad)" stroke="#64748B" stroke-width="1.6" />
    <!-- Top Specular Highlight on Flange -->
    <line x1="106" y1="336" x2="406" y2="336" stroke="#FFFFFF" stroke-width="2" />
    <!-- Middle Mold Parting Line -->
    <line x1="104" y1="352" x2="408" y2="352" stroke="#475569" stroke-width="1.5" />
    <line x1="105" y1="362" x2="407" y2="362" stroke="#94A3B8" stroke-width="1" />

    <!-- Vertical Seam Lines on Flange -->
    <g stroke="#94A3B8" stroke-width="1.2">
      <line x1="130" y1="334" x2="130" y2="385" />
      <line x1="186" y1="334" x2="186" y2="371" />
      <line x1="326" y1="334" x2="326" y2="385" />
      <line x1="382" y1="334" x2="382" y2="385" />
    </g>

    <!-- ── C. MAIN ODU-200 TAPERED UPPER HOOD (y=60..334) ── -->
    <g clip-path="url(#hoodClip)">
      <!-- Base Fill -->
      <rect x="100" y="55" width="312" height="285" fill="url(#hoodCenter)" />
      <!-- Left Wing 3D Shading -->
      <path d="M 100 55 L 188 55 L 188 340 L 100 340 Z" fill="url(#hoodLeftWing)" />
      <!-- Right Wing 3D Shading -->
      <path d="M 324 55 L 412 55 L 412 340 L 324 340 Z" fill="url(#hoodRightWing)" />
      <!-- Top Chamfered Roof Band -->
      <path d="M 130 60 Q 256 48 382 60 L 386 92 Q 256 78 126 92 Z" fill="url(#hoodRoof)" />

      <!-- Inner Tapered Contour Lines (Exact ODU-200 Molding Geometry) -->
      <path d="M 148 76 L 138 308 Q 137 326 128 334" stroke="#CBD5E1" stroke-width="1.5" fill="none" />
      <path d="M 364 76 L 374 308 Q 375 326 384 334" stroke="#CBD5E1" stroke-width="1.5" fill="none" />

      <!-- Two Primary Vertical Panel Seam Lines (x=188 and x=324) -->
      <line x1="188" y1="64" x2="188" y2="334" stroke="#CBD5E1" stroke-width="1.6" />
      <line x1="189.5" y1="64" x2="189.5" y2="334" stroke="#FFFFFF" stroke-width="1.2" />
      <line x1="324" y1="64" x2="324" y2="334" stroke="#CBD5E1" stroke-width="1.6" />
      <line x1="322.5" y1="64" x2="322.5" y2="334" stroke="#FFFFFF" stroke-width="1.2" />

      <!-- Top Roof Seam Line & Center Notch -->
      <path d="M 134 92 Q 256 78 378 92" stroke="#CBD5E1" stroke-width="1.4" fill="none" />
      <path d="M 134 93.5 Q 256 79.5 378 93.5" stroke="#FFFFFF" stroke-width="1.5" fill="none" />
      <rect x="253" y="64" width="6" height="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- 4 Lower Bolt Recess Alcoves along the Bottom of the Hood (y=302..334) -->
      <rect x="148" y="302" width="40" height="32" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3" />
      <rect x="212" y="302" width="44" height="32" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3" />
      <rect x="256" y="302" width="44" height="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3" />
      <rect x="324" y="302" width="40" height="32" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.3" />
    </g>

    <!-- Outer Crisp Contour Outline of ODU-200 Hood -->
    <path d="M 148 76 Q 256 60 364 76 L 376 98 L 388 308 Q 389 329 406 334 L 106 334 Q 123 329 124 308 L 136 98 Z"
          stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" fill="none" />

    <!-- 6 Hex Flange Bolts along y=328..334 -->
    <g fill="url(#metalNut)" stroke="#334155" stroke-width="1.3">
      <!-- Far Left Bolt -->
      <rect x="114" y="328" width="12" height="6" rx="1" />
      <!-- Left-Inner Bolt -->
      <rect x="166" y="328" width="14" height="6" rx="1" />
      <!-- Center Bolt -->
      <rect x="249" y="328" width="14" height="6" rx="1" />
      <!-- Right-Inner Bolt -->
      <rect x="332" y="328" width="14" height="6" rx="1" />
      <!-- Far Right Bolt -->
      <rect x="386" y="328" width="12" height="6" rx="1" />
    </g>

    <!-- ── D. AUTHENTIC FRONT LOGOS (Lte™, CYFROWY POLSAT, plus) ── -->

    <!-- 1. Official "Lte™" Logo (Top-Right of Center Panel, x=282..320, y=96..134) -->
    <g transform="translate(275, 96)">
      <!-- Signal Waves above 't' -->
      <path d="M 19 10 A 7 7 0 0 1 28 19" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" fill="none" />
      <path d="M 18 5 A 12 12 0 0 1 33 20" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" fill="none" />
      <path d="M 17 0 A 17 17 0 0 1 38 21" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" fill="none" />
      <!-- "Lte" Typography -->
      <text x="0" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="25" letter-spacing="-1" fill="#0F172A">Lte</text>
      <text x="37" y="21" font-family="system-ui, -apple-system, Arial, sans-serif" font-weight="700" font-size="5.5" fill="#0F172A">TM</text>
    </g>

    <!-- 2. Official "CYFROWY POLSAT" Badge (Center Panel, x=186..326, y=166..212) -->
    <g transform="translate(188, 166)">
      <!-- Outer Black Rounded Pill -->
      <rect x="0" y="0" width="136" height="44" rx="8" fill="url(#cpBadge)" />
      <!-- Left Globe Box & White Swoosh Divider -->
      <path d="M 48 0 C 56 14, 56 30, 48 44" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
      <!-- Dotted Globe Icon (x=25, y=22, r=15) -->
      <circle cx="25" cy="22" r="14.5" stroke="#FFFFFF" stroke-width="1.2" fill="none" />
      <!-- Globe Latitude & Longitude Grid (Crisp Vector) -->
      <ellipse cx="25" cy="22" rx="7" ry="14.5" stroke="#FFFFFF" stroke-width="1.1" stroke-dasharray="2 1.5" fill="none" />
      <ellipse cx="25" cy="22" rx="14.5" ry="6" stroke="#FFFFFF" stroke-width="1.1" stroke-dasharray="2 1.5" fill="none" />
      <line x1="25" y1="7.5" x2="25" y2="36.5" stroke="#FFFFFF" stroke-width="1.2" />
      <line x1="10.5" y1="22" x2="39.5" y2="22" stroke="#FFFFFF" stroke-width="1.2" />
      <!-- "CYFROWY POLSAT" Text -->
      <text x="93" y="20" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="10.5" letter-spacing="0.6" fill="#FFFFFF">CYFROWY</text>
      <text x="93" y="31" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="10.5" letter-spacing="1.2" fill="#FFFFFF">POLSAT</text>
    </g>

    <!-- 3. Official "plus" Logo (Lower Center Panel, x=186..326, y=236..276) -->
    <g transform="translate(185, 234)">
      <!-- "plus" Wordmark -->
      <text x="0" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.5" fill="#0F172A">plus</text>
      <!-- Iconic Plus Smile Symbol (Right of wordmark) -->
      <g transform="translate(92, 4)">
        <!-- Tilted Plus Cross -->
        <path d="M 19 3 L 14 21" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 6 11 L 23 11" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
        <!-- Right Dot of Smile -->
        <circle cx="28" cy="14" r="3" fill="#0F172A" />
        <!-- Smile Arc -->
        <path d="M 4 20 C 7 30, 22 30, 27 21" stroke="#0F172A" stroke-width="4.2" stroke-linecap="round" fill="none" />
      </g>
    </g>

  </g>
</svg>
