<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ODU Manager</title>
  <style>
    :root {
      --surface: #FFFFFF;
      --surface-subtle: #F8FAFC;
      --text-primary: #141414;
      --text-secondary: #64748B;
      --primary: #1856FF;
      --primary-pressed: #1040CC;
      --danger: #EA2143;
      --border: #E2E8F0;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--surface);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow-x: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--surface);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ==========================================
       1. NORMAL STARTUP SCREEN
       ========================================== */
    #splashScreen {
      z-index: 30;
      justify-content: space-between;
      padding: 64px 24px 48px;
    }

    .splash-spacer {
      height: 24px;
    }

    .splash-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .app-logo-clean {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-logo-clean img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .splash-app-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .splash-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid #E2E8F0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==========================================
       2. NO WI-FI SCREEN (PURE iOS LIQUID GLASS WIFI + X)
       ========================================== */
    #noWifiScreen {
      z-index: 20;
      text-align: center;
      background: radial-gradient(circle at 50% 34%, #F4F8FF 0%, #FFFFFF 68%);
    }

    .wifi-card-wrap {
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Standalone iOS SF Symbol Wi-Fi + X in Liquid Glass (no circle/box container) */
    .ios-wifi-glass-wrap {
      position: relative;
      width: 156px;
      height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: floatSymbol 3.2s ease-in-out infinite;
    }

    @keyframes floatSymbol {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .ios-wifi-svg {
      width: 156px;
      height: 132px;
      overflow: visible;
    }

    /* Subtle sequential liquid refraction pulse on the 3 iOS Wi-Fi bars */
    .glass-bar-1 {
      animation: barGlassPulse 2.4s ease-in-out infinite;
      animation-delay: 0s;
      transform-origin: 108px 104px;
    }
    .glass-bar-2 {
      animation: barGlassPulse 2.4s ease-in-out infinite;
      animation-delay: 0.25s;
      transform-origin: 108px 104px;
    }
    .glass-bar-3 {
      animation: barGlassPulse 2.4s ease-in-out infinite;
      animation-delay: 0.5s;
      transform-origin: 108px 104px;
    }

    @keyframes barGlassPulse {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }

    /* Standalone Liquid Glass X animation */
    .glass-x-group {
      transform-origin: 154px 92px;
      animation: xGlassBreath 2.2s ease-in-out infinite;
    }

    @keyframes xGlassBreath {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.08) rotate(2deg); }
    }

    .state-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .state-desc {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .action-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      min-height: 50px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
      border: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 8px 20px -6px rgba(24, 86, 255, 0.42);
    }

    .btn-primary:active {
      background: var(--primary-pressed);
    }

    .btn-secondary {
      background: var(--surface-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-text {
      margin-top: 6px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
    }

    /* ==========================================
       3. SIMPLE MINIMAL START / LOGIN SCREEN
       ========================================== */
    #startScreen {
      z-index: 10;
      justify-content: flex-start;
      padding: 32px 24px 24px;
      overflow-y: auto;
    }

    .start-container {
      width: 100%;
      max-width: 380px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modem-preview {
      width: 96px;
      height: 96px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modem-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .wifi-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #F0FDF4;
      color: #15803D;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .wifi-badge.offline {
      background: #FEF2F2;
      color: var(--danger);
    }

    .wifi-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .start-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .start-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      text-align: center;
    }

    .segmented-control {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface-subtle);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .seg-btn {
      padding: 10px 6px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(20, 20, 20, 0.06);
    }

    .model-spec-line {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      text-align: center;
    }

    .form-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .field input:focus {
      background: var(--surface);
      border-color: var(--primary);
    }

    .status-msg {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-primary);
      text-align: center;
    }

    .status-msg.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- 1. NORMAL STARTUP SCREEN -->
  <section class="screen active" id="splashScreen">
    <div class="splash-spacer"></div>
    <div class="splash-center">
      <div class="app-logo-clean">
        <img src="odu200.png" alt="ODU-200" />
      </div>
      <div class="splash-app-name">ODU Manager</div>
    </div>
    <div class="splash-footer">
      <div class="spinner"></div>
    </div>
  </section>

  <!-- 2. NO WI-FI SCREEN (AUTHENTIC iOS SF SYMBOL WIFI + X IN LIQUID GLASS, NO CIRCLE/BOX) -->
  <section class="screen" id="noWifiScreen">
    <div class="wifi-card-wrap">

      <div class="ios-wifi-glass-wrap">
        <svg class="ios-wifi-svg" viewBox="0 0 216 148" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Translucent iOS Liquid Glass Body for Wi-Fi Bars -->
            <linearGradient id="iosWifiGlassBody" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#DCEBFF" stop-opacity="0.88" />
              <stop offset="45%" stop-color="#93C5FD" stop-opacity="0.52" />
              <stop offset="80%" stop-color="#3B82F6" stop-opacity="0.44" />
              <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0.85" />
            </linearGradient>

            <!-- Top-left Specular Highlight Gradient for Wi-Fi Bars -->
            <linearGradient id="iosWifiGlassRim" x1="0%" y1="0%" x2="80%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
              <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.65" />
              <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.55" />
            </linearGradient>

            <!-- Inner Glass Sheen Overlay -->
            <linearGradient id="iosWifiSheen" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
              <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0" />
            </linearGradient>

            <!-- Translucent iOS Liquid Glass Body for the Standalone X -->
            <linearGradient id="iosXGlassBody" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF8FA3" stop-opacity="0.92" />
              <stop offset="50%" stop-color="#EA2143" stop-opacity="0.72" />
              <stop offset="100%" stop-color="#FF4D6D" stop-opacity="0.90" />
            </linearGradient>

            <!-- Specular Glass Rim for the Standalone X -->
            <linearGradient id="iosXGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
              <stop offset="55%" stop-color="#FFE4E8" stop-opacity="0.75" />
              <stop offset="100%" stop-color="#FB7185" stop-opacity="0.65" />
            </linearGradient>

            <!-- Soft Refractive Drop Shadow for Wi-Fi Glass Bars -->
            <filter id="wifiLiquidShadow" x="-25%" y="-25%" width="150%" height="160%">
              <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1E40AF" flood-opacity="0.16" />
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B82F6" flood-opacity="0.12" />
            </filter>

            <!-- Soft Refractive Drop Shadow for Standalone Liquid Glass X -->
            <filter id="xLiquidShadow" x="-35%" y="-35%" width="170%" height="170%">
              <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#EA2143" flood-opacity="0.28" />
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.5" />
            </filter>
          </defs>

          <!-- AUTHENTIC APPLE iOS SF SYMBOL WI-FI FILLED WEDGES IN LIQUID GLASS -->
          <g filter="url(#wifiLiquidShadow)">
            <!-- Outer Wi-Fi Wedge (Arc 3) -->
            <g class="glass-bar-3">
              <path
                d="M 28.4 49.6
                   A 104 104 0 0 1 171.6 49.6
                   A 8.5 8.5 0 0 1 159.4 61.8
                   A 86.8 86.8 0 0 0 40.6 61.8
                   A 8.5 8.5 0 0 1 28.4 49.6 Z"
                fill="url(#iosWifiGlassBody)"
                stroke="url(#iosWifiGlassRim)"
                stroke-width="1.8"
              />
              <!-- Specular top glass reflection -->
              <path
                d="M 32 49.2 A 101 101 0 0 1 168 49.2 A 95 95 0 0 0 32 49.2 Z"
                fill="url(#iosWifiSheen)"
              />
            </g>

            <!-- Middle Wi-Fi Wedge (Arc 2) -->
            <g class="glass-bar-2">
              <path
                d="M 52.8 74.2
                   A 69.5 69.5 0 0 1 147.2 74.2
                   A 8.5 8.5 0 0 1 135.0 86.4
                   A 52.3 52.3 0 0 0 65.0 86.4
                   A 8.5 8.5 0 0 1 52.8 74.2 Z"
                fill="url(#iosWifiGlassBody)"
                stroke="url(#iosWifiGlassRim)"
                stroke-width="1.8"
              />
              <path
                d="M 56 73.8 A 66 66 0 0 1 144 73.8 A 61 61 0 0 0 56 73.8 Z"
                fill="url(#iosWifiSheen)"
              />
            </g>

            <!-- Inner Wi-Fi Wedge (Arc 1) + Bottom Dot -->
            <g class="glass-bar-1">
              <path
                d="M 77.2 98.6
                   A 35 35 0 0 1 122.8 98.6
                   A 8.5 8.5 0 0 1 110.6 110.8
                   A 17.8 17.8 0 0 0 89.4 110.8
                   A 8.5 8.5 0 0 1 77.2 98.6 Z"
                fill="url(#iosWifiGlassBody)"
                stroke="url(#iosWifiGlassRim)"
                stroke-width="1.8"
              />
              <!-- Bottom iOS Wi-Fi Circle Dot -->
              <circle
                cx="100"
                cy="126"
                r="10.5"
                fill="url(#iosWifiGlassBody)"
                stroke="url(#iosWifiGlassRim)"
                stroke-width="1.8"
              />
              <ellipse
                cx="98"
                cy="121.5"
                rx="6"
                ry="3"
                fill="url(#iosWifiSheen)"
              />
            </g>
          </g>

          <!-- STANDALONE LIQUID GLASS 'X' (NO CIRCLE/SQUARE CONTAINER) -->
          <g class="glass-x-group" filter="url(#xLiquidShadow)">
            <!-- First Glass Capsule of X (\) -->
            <g transform="translate(154, 96) rotate(45)">
              <rect
                x="-23"
                y="-6.5"
                width="46"
                height="13"
                rx="6.5"
                fill="url(#iosXGlassBody)"
                stroke="url(#iosXGlassRim)"
                stroke-width="1.6"
              />
              <!-- Specular glass highlight strip inside rod -->
              <rect
                x="-19"
                y="-4.5"
                width="38"
                height="3.5"
                rx="1.75"
                fill="#FFFFFF"
                fill-opacity="0.55"
              />
            </g>

            <!-- Second Glass Capsule of X (/) -->
            <g transform="translate(154, 96) rotate(-45)">
              <rect
                x="-23"
                y="-6.5"
                width="46"
                height="13"
                rx="6.5"
                fill="url(#iosXGlassBody)"
                stroke="url(#iosXGlassRim)"
                stroke-width="1.6"
              />
              <!-- Specular glass highlight strip inside rod -->
              <rect
                x="-19"
                y="-4.5"
                width="38"
                height="3.5"
                rx="1.75"
                fill="#FFFFFF"
                fill-opacity="0.55"
              />
            </g>
          </g>
        </svg>
      </div>

      <h1 class="state-title">Podłącz się do Wi-Fi swojego ODU-IDU</h1>
      <p class="state-desc">
        Nie wykryto połączenia z siecią Wi-Fi routera ODU-IDU. Połącz telefon z Wi-Fi swojego zestawu, aby kontynuować.
      </p>

      <div class="action-stack">
        <button class="btn btn-primary" onclick="openWifiSettings()">
          Otwórz ustawienia Wi-Fi
        </button>
        <button class="btn btn-secondary" onclick="recheckWifi()">
          Sprawdź ponownie
        </button>
        <button class="btn-text" onclick="showScreen('startScreen')">
          Przejdź do logowania ręcznego →
        </button>
      </div>
    </div>
  </section>

  <!-- 3. SIMPLE START / LOGIN SCREEN -->
  <section class="screen" id="startScreen">
    <div class="start-container">
      <div class="modem-preview">
        <img src="odu200.png" alt="ODU-200" />
      </div>

      <div class="wifi-badge" id="wifiStatusBadge" onclick="showScreen('noWifiScreen')">
        <span class="wifi-badge-dot"></span>
        <span id="wifiStatusLabel">Sprawdzanie Wi-Fi...</span>
      </div>

      <h1 class="start-title">ODU Manager</h1>
      <p class="start-subtitle">Wybierz swój zestaw i zaloguj się do bramy IDU</p>

      <div class="segmented-control">
        <button class="seg-btn active" onclick="pickModel(this, 'ODU-IDU 200', 'LTE Cat. 4 (150 Mb/s) • FDD: B3, B7, B20')">
          ODU-200
        </button>
        <button class="seg-btn" onclick="pickModel(this, 'ODU-IDU 300', 'LTE Cat. 6 (2CA 300 Mb/s) • B3, B7, B8, B20, B38')">
          ODU-300
        </button>
        <button class="seg-btn" onclick="pickModel(this, 'ODU-IDU 100', 'LTE Cat. 3 (30 Mb/s) • FDD: B3 (1800 MHz)')">
          ODU-100
        </button>
      </div>
      <div class="model-spec-line" id="modelSpecLine">
        LTE Cat. 4 (150 Mb/s) • FDD: B3, B7, B20
      </div>

      <div class="form-box">
        <div class="field">
          <label>Adres bramy IDU</label>
          <input type="text" id="gwInput" value="192.168.0.1" />
        </div>
        <div class="field">
          <label>Hasło administratora (domyślnie: admin)</label>
          <input type="password" id="passInput" value="admin" />
        </div>
      </div>

      <div class="action-stack">
        <button class="btn btn-primary" onclick="loginToOdu()">
          Połącz z modemem
        </button>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </div>
  </section>

  <script>
    let selectedModel = 'ODU-IDU 200';
    let lastWifiState = false;
    let lastOduReachable = false;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function updateBadge(wifiOn, oduReachable) {
      const badge = document.getElementById('wifiStatusBadge');
      const label = document.getElementById('wifiStatusLabel');
      if (wifiOn && oduReachable) {
        badge.className = 'wifi-badge';
        label.textContent = 'Połączono z ODU-IDU (192.168.0.1)';
      } else if (wifiOn) {
        badge.className = 'wifi-badge offline';
        label.textContent = 'Wi-Fi aktywne • Brak bramy ODU-IDU';
      } else {
        badge.className = 'wifi-badge offline';
        label.textContent = 'Brak połączenia Wi-Fi';
      }
    }

    window.onConnectionStatus = function(wifiOn, oduReachable, httpCode) {
      lastWifiState = wifiOn;
      lastOduReachable = oduReachable;
      updateBadge(wifiOn, oduReachable);

      if (!wifiOn || !oduReachable) {
        showScreen('noWifiScreen');
      } else {
        showScreen('startScreen');
      }
    };

    function performInitialCheck() {
      const gw = document.getElementById('gwInput').value.trim();
      if (window.OduBridge && window.OduBridge.checkOduConnection) {
        window.OduBridge.checkOduConnection(gw);
      } else {
        updateBadge(false, false);
        showScreen('noWifiScreen');
      }
    }

    function openWifiSettings() {
      if (window.OduBridge && window.OduBridge.openWifiSettings) {
        window.OduBridge.openWifiSettings();
      }
    }

    function recheckWifi() {
      showScreen('splashScreen');
      setTimeout(performInitialCheck, 550);
    }

    window.onNativeResume = function() {
      const gw = document.getElementById('gwInput').value.trim();
      if (window.OduBridge && window.OduBridge.checkOduConnection) {
        window.OduBridge.checkOduConnection(gw);
      }
    };

    function pickModel(btn, modelName, specText) {
      selectedModel = modelName;
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('modelSpecLine').textContent = specText;
      document.getElementById('statusMsg').classList.remove('show');
    }

    function loginToOdu() {
      const gw = document.getElementById('gwInput').value.trim();
      const msg = document.getElementById('statusMsg');
      msg.textContent = 'Łączenie z ' + gw + ' (' + selectedModel + ')...';
      msg.classList.add('show');

      if (window.OduBridge && window.OduBridge.checkOduConnection) {
        if (!window.OduBridge.isWifiConnected()) {
          showScreen('noWifiScreen');
          return;
        }
      }

      setTimeout(() => {
        if (lastOduReachable) {
          msg.textContent = 'Połączono z bramą ' + gw + ' (' + selectedModel + ').';
        } else {
          msg.textContent = 'Brama ' + gw + ' nie odpowiada — upewnij się, że jesteś podpięty pod Wi-Fi swojego ODU-IDU.';
        }
      }, 450);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(performInitialCheck, 850);
    });
  </script>
</body>
</html>
