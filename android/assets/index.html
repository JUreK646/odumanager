<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ODU Manager</title>
  <style>
    /* TypeUI Design System Tokens (Clean + Minimal + Liquid Glass) */
    :root {
      --surface: #FFFFFF;
      --surface-subtle: #F8FAFC;
      --text-primary: #141414;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;
      --primary: #1856FF;
      --primary-pressed: #1040CC;
      --danger: #EA2143;
      --success: #07CA6B;
      --border: #E2E8F0;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--surface);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow-x: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--surface);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease, transform 0.32s ease;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* ==========================================
       1. NORMAL STARTUP SCREEN (SPLASH)
       ========================================== */
    #splashScreen {
      z-index: 30;
      justify-content: space-between;
      padding: 64px 24px 48px;
    }

    .splash-Spacer {
      height: 24px;
    }

    .splash-center {
      display: flex;
      flex-direction: column;
      align-items: center;
       gap: 16px;
    }

    .app-logo-clean {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-logo-clean img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .splash-app-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .splash-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid #E2E8F0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==========================================
       2. NO WI-FI SCREEN (LIQUID GLASS WIFI + X)
       ========================================== */
    #noWifiScreen {
      z-index: 20;
      text-align: center;
    }

    .wifi-card-wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* LIQUID GLASS ICON STAGE */
    .liquid-stage {
      position: relative;
      width: 148px;
      height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    /* Ambient refracted color orbs behind the liquid glass */
    .liquid-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(22px);
      opacity: 0.65;
      animation: blobFloat 5s ease-in-out infinite alternate;
    }

    .liquid-blob.b1 {
      width: 88px;
      height: 88px;
      background: radial-gradient(circle, #60A5FA 0%, #1856FF 100%);
      top: 10px;
      left: 12px;
    }

    .liquid-blob.b2 {
      width: 84px;
      height: 84px;
      background: radial-gradient(circle, #FF6B8B 0%, #EA2143 100%);
      bottom: 8px;
      right: 10px;
      animation-delay: -2.5s;
    }

    @keyframes blobFloat {
      0% { transform: translate(0, 0) scale(0.95); }
      100% { transform: translate(8px, -8px) scale(1.08); }
    }

    /* Main Liquid Glass Squircle */
    .liquid-glass-tile {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 34px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.78) 0%,
        rgba(255, 255, 255, 0.42) 50%,
        rgba(248, 250, 252, 0.65) 100%
      );
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 20px 40px -12px rgba(20, 20, 20, 0.12),
        0 4px 12px rgba(24, 86, 255, 0.08),
        inset 0 2px 3px rgba(255, 255, 255, 0.95),
        inset 0 -2px 6px rgba(148, 163, 184, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: glassHover 3.4s ease-in-out infinite;
    }

    /* Specular liquid highlight arc */
    .liquid-glass-tile::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 30px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 45%);
      pointer-events: none;
    }

    @keyframes glassHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    /* Wi-Fi SVG inside Liquid Glass */
    .wifi-svg {
      width: 58px;
      height: 58px;
      overflow: visible;
    }

    .wifi-arc {
      fill: none;
      stroke: #1E293B;
      stroke-width: 5.5;
      stroke-linecap: round;
      opacity: 0.25;
      animation: wifiSearch 2.2s ease-in-out infinite;
    }

    .wifi-arc.a1 { animation-delay: 0s; }
    .wifi-arc.a2 { animation-delay: 0.25s; }
    .wifi-arc.a3 { animation-delay: 0.5s; }

    .wifi-dot {
      fill: #1E293B;
      opacity: 0.45;
    }

    @keyframes wifiSearch {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.65; }
    }

    /* Liquid Glass Red X Badge */
    .liquid-x-badge {
      position: absolute;
      bottom: 8px;
      right: 6px;
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(234, 33, 67, 0.92) 0%, rgba(220, 38, 38, 0.78) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 10px 20px -4px rgba(234, 33, 67, 0.42),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: xPulse 2.2s ease-in-out infinite;
    }

    @keyframes xPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .liquid-x-badge svg {
      width: 20px;
      height: 20px;
      stroke: #FFFFFF;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .state-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .state-desc {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .action-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      min-height: 50px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
      border: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 8px 20px -6px rgba(24, 86, 255, 0.45);
    }

    .btn-primary:active {
      background: var(--primary-pressed);
    }

    .btn-secondary {
      background: var(--surface-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-text {
      margin-top: 8px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
    }

    /* ==========================================
       3. SIMPLE MINIMAL START / LOGIN SCREEN
       ========================================== */
    #startScreen {
      z-index: 10;
      justify-content: flex-start;
      padding: 32px 24px 24px;
      overflow-y: auto;
    }

    .start-container {
      width: 100%;
      max-width: 380px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modem-preview {
      width: 96px;
      height: 96px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modem-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .wifi-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #F0FDF4;
      color: #15803D;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .wifi-badge.offline {
      background: #FEF2F2;
      color: var(--danger);
    }

    .wifi-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .start-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .start-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      text-align: center;
    }

    /* Clean Segmented Model Selector */
    .segmented-control {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface-subtle);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .seg-btn {
      padding: 10px 6px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(20, 20, 20, 0.06);
    }

    .model-spec-line {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      text-align: center;
    }

    /* Simple Form */
    .form-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .field input:focus {
      background: var(--surface);
      border-color: var(--primary);
    }

    .status-msg {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-primary);
      text-align: center;
    }

    .status-msg.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- 1. NORMAL STARTUP SCREEN -->
  <section class="screen active" id="splashScreen">
    <div class="splash-Spacer"></div>
    <div class="splash-center">
      <div class="app-logo-clean">
        <img src="odu200.png" alt="ODU-200" />
      </div>
      <div class="splash-app-name">ODU Manager</div>
    </div>
    <div class="splash-footer">
      <div class="spinner"></div>
    </div>
  </section>

  <!-- 2. NO WI-FI SCREEN (LIQUID GLASS WIFI + X) -->
  <section class="screen" id="noWifiScreen">
    <div class="wifi-card-wrap">
      <div class="liquid-stage">
        <div class="liquid-blob b1"></div>
        <div class="liquid-blob b2"></div>

        <div class="liquid-glass-tile">
          <svg class="wifi-svg" viewBox="0 0 64 64">
            <path class="wifi-arc a3" d="M8 24 C21 11, 43 11, 56 24" />
            <path class="wifi-arc a2" d="M16 33 C25 24, 39 24, 48 33" />
            <path class="wifi-arc a1" d="M24 42 C28.5 37.5, 35.5 37.5, 40 42" />
            <circle class="wifi-dot" cx="32" cy="50" r="3.5" />
          </svg>
        </div>

        <div class="liquid-x-badge">
          <svg viewBox="0 0 24 24">
            <line x1="7" y1="7" x2="17" y2="17" />
            <line x1="17" y1="7" x2="7" y2="17" />
          </svg>
        </div>
      </div>

      <h1 class="state-title">Podłącz się do Wi-Fi swojego ODU-IDU</h1>
      <p class="state-desc">
        Nie wykryto połączenia z siecią Wi-Fi routera ODU-IDU. Połącz telefon z Wi-Fi swojego zestawu, aby kontynuować.
      </p>

      <div class="action-stack">
        <button class="btn btn-primary" onclick="openWifiSettings()">
          Otwórz ustawienia Wi-Fi
        </button>
        <button class="btn btn-secondary" onclick="recheckWifi()">
          Sprawdź ponownie
        </button>
        <button class="btn-text" onclick="showScreen('startScreen')">
          Przejdź do logowania ręcznego →
        </button>
      </div>
    </div>
  </section>

  <!-- 3. SIMPLE START / LOGIN SCREEN -->
  <section class="screen" id="startScreen">
    <div class="start-container">
      <div class="modem-preview">
        <img src="odu200.png" alt="ODU-200" />
      </div>

      <div class="wifi-badge" id="wifiStatusBadge" onclick="showScreen('noWifiScreen')">
        <span class="wifi-badge-dot"></span>
        <span id="wifiStatusLabel">Sprawdzanie Wi-Fi...</span>
      </div>

      <h1 class="start-title">ODU Manager</h1>
      <p class="start-subtitle">Wybierz swój zestaw i zaloguj się do bramy IDU</p>

      <div class="segmented-control">
        <button class="seg-btn active" onclick="pickModel(this, 'ODU-IDU 200', 'LTE Cat. 4 (150 Mb/s) • FDD: B3, B7, B20')">
          ODU-200
        </button>
        <button class="seg-btn" onclick="pickModel(this, 'ODU-IDU 300', 'LTE Cat. 6 (2CA 300 Mb/s) • B3, B7, B8, B20, B38')">
          ODU-300
        </button>
        <button class="seg-btn" onclick="pickModel(this, 'ODU-IDU 100', 'LTE Cat. 3 (30 Mb/s) • FDD: B3 (1800 MHz)')">
          ODU-100
        </button>
      </div>
      <div class="model-spec-line" id="modelSpecLine">
        LTE Cat. 4 (150 Mb/s) • FDD: B3, B7, B20
      </div>

      <div class="form-box">
        <div class="field">
          <label>Adres bramy IDU</label>
          <input type="text" id="gwInput" value="192.168.0.1" />
        </div>
        <div class="field">
          <label>Hasło administratora (domyślnie: admin)</label>
          <input type="password" id="passInput" value="admin" />
        </div>
      </div>

      <div class="action-stack">
        <button class="btn btn-primary" onclick="loginToOdu()">
          Połącz z modemem
        </button>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </div>
  </section>

  <script>
    let selectedModel = 'ODU-IDU 200';
    let lastWifiState = false;
    let lastOduReachable = false;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function updateBadge(wifiOn, oduReachable) {
      const badge = document.getElementById('wifiStatusBadge');
      const label = document.getElementById('wifiStatusLabel');
      if (wifiOn && oduReachable) {
        badge.className = 'wifi-badge';
        label.textContent = 'Połączono z ODU-IDU (192.168.0.1)';
      } else if (wifiOn) {
        badge.className = 'wifi-badge offline';
        label.textContent = 'Wi-Fi aktywne • Brak bramy ODU-IDU';
      } else {
        badge.className = 'wifi-badge offline';
        label.textContent = 'Brak połączenia Wi-Fi';
      }
    }

    window.onConnectionStatus = function(wifiOn, oduReachable, httpCode) {
      lastWifiState = wifiOn;
      lastOduReachable = oduReachable;
      updateBadge(wifiOn, oduReachable);

      // If not connected to Wi-Fi or ODU gateway is not reachable on current Wi-Fi, show the Liquid Glass Wi-Fi + X screen
      if (!wifiOn || !oduReachable) {
        showScreen('noWifiScreen');
      } else {
        showScreen('startScreen');
      }
    };

    function performInitialCheck() {
      const gw = document.getElementById('gwInput').value.trim();
      if (window.OduBridge && window.OduBridge.checkOduConnection) {
        window.OduBridge.checkOduConnection(gw);
      } else {
        // Browser preview fallback: show Liquid Glass No-Wi-Fi screen after normal splash
        updateBadge(false, false);
        showScreen('noWifiScreen');
      }
    }

    function openWifiSettings() {
      if (window.OduBridge && window.OduBridge.openWifiSettings) {
        window.OduBridge.openWifiSettings();
      }
    }

    function recheckWifi() {
      showScreen('splashScreen');
      setTimeout(performInitialCheck, 550);
    }

    window.onNativeResume = function() {
      // Automatically re-check when user comes back from Android Wi-Fi settings
      const gw = document.getElementById('gwInput').value.trim();
      if (window.OduBridge && window.OduBridge.checkOduConnection) {
        window.OduBridge.checkOduConnection(gw);
      }
    };

    function pickModel(btn, modelName, specText) {
      selectedModel = modelName;
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('modelSpecLine').textContent = specText;
      document.getElementById('statusMsg').classList.remove('show');
    }

    function loginToOdu() {
      const gw = document.getElementById('gwInput').value.trim();
      const msg = document.getElementById('statusMsg');
      msg.textContent = 'Łączenie z ' + gw + ' (' + selectedModel + ')...';
      msg.classList.add('show');

      if (window.OduBridge && window.OduBridge.checkOduConnection) {
        if (!window.OduBridge.isWifiConnected()) {
          showScreen('noWifiScreen');
          return;
        }
      }

      setTimeout(() => {
        if (lastOduReachable) {
          msg.textContent = 'Połączono z bramą ' + gw + ' (' + selectedModel + ').';
        } else {
          msg.textContent = 'Brama ' + gw + ' nie odpowiada — upewnij się, że jesteś podpięty pod Wi-Fi swojego ODU-IDU.';
        }
      }, 450);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(performInitialCheck, 850);
    });
  </script>
</body>
</html>
